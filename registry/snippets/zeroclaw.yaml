# ZeroClaw defines MCP servers as an array of tables (`[[mcp.servers]]`) in
# ~/.zeroclaw/config.toml, each identified by `name` (upstream:
# docs/book/src/tools/mcp.md). A server is only connected for agents that are
# granted it through `mcp_bundles`, e.g. in TOML:
#   [mcp_bundles.foreman]
#   servers = ["foreman"]
#   [agents.<alias>]
#   mcp_bundles = ["foreman"]
mcp:
  enabled: true
  servers:
    - name: foreman
      command: foreman
      args: ["mcp-stdio", "--source", "zeroclaw"]
