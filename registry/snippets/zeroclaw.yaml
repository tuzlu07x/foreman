# ZeroClaw keeps MCP servers in a `[[mcp.servers]]` array in
# ~/.zeroclaw/config.toml and connects an agent only to the servers of the
# bundles listed in its `agents.<alias>.mcp_bundles` (zeroclaw
# docs/book/src/tools/mcp.md). `foreman agent add` writes this in TOML:
#
#   [[mcp.servers]]
#   name = "foreman"
#   command = "foreman"
#   args = ["mcp-stdio", "--source", "zeroclaw"]
#   [mcp.servers.env]
#   FOREMAN_AGENT_TOKEN = "<written by foreman agent rewire>"
#
#   [mcp_bundles.foreman]
#   servers = ["foreman"]
#
# and adds "foreman" to `mcp_bundles` of every [agents.<alias>] in the file.
mcp:
  servers:
    - name: foreman
      command: foreman
      args: ["mcp-stdio", "--source", "zeroclaw"]
      # Proves the agent's identity (#618); never in args.
      env:
        FOREMAN_AGENT_TOKEN: "<written by foreman agent rewire>"
mcp_bundles:
  foreman:
    servers: ["foreman"]
