# Claude Code stores user-scope MCP servers under `mcpServers` in ~/.claude.json
# (not in ~/.claude/settings.json). Register this block with:
#   claude mcp add --scope user foreman -- foreman mcp-stdio --source claude-code
mcpServers:
  foreman:
    command: foreman
    args: ["mcp-stdio", "--source", "claude-code"]
