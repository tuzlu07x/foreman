# OpenClaw uses JSON5 natively (~/.openclaw/openclaw.json). This YAML mirror
# is the canonical form `foreman agent add` rewrites into the agent's
# actual config syntax. OpenClaw validates its config strictly and refuses
# to start on unknown keys (upstream: docs/gateway/configuration.md), so only
# `mcp.servers` belongs here. #395: `mcp.enabled` is rejected.
mcp:
  servers:
    foreman:
      command: foreman
      args: ["mcp-stdio", "--source", "openclaw"]
      # Proves the agent's identity (#618). `foreman agent add` / `rewire`
      # write the real token here; it never goes in args.
      env:
        FOREMAN_AGENT_TOKEN: "<written by foreman agent rewire>"
