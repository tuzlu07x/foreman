name: release-binaries

# Standalone binaries for every release (#620).
#
# Each binary is a Node.js single executable application: the official
# Node.js binary for the target (downloaded from nodejs.org and checked
# against its SHASUMS256.txt, same version as the runner's Node) with the
# whole CLI bundled in. See scripts/build-binaries.mjs.
#
# Each target builds on a runner of its own architecture: the bundle carries
# a native addon (better-sqlite3) that can't be cross-compiled, so a binary
# built on another arch would ship the wrong one (the build script refuses).
# Every binary is smoke-tested on the machine that built it, from an empty
# directory with throwaway homes (scripts/smoke-binary.py): version, init
# (native addon + migrations), doctor, mcp-stdio, the MCP hub's SDK client,
# the TUI in a pseudo-terminal, and the demo. A SHA256SUMS file is published
# next to them.
#
# Security: runs only on a published release (a maintainer action) or a
# manual dispatch, never on pull requests. Actions are pinned by commit SHA.
# Build jobs get a read-only token; only the checksums job, which attaches
# the files to a real release, gets `contents: write`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-15
          - label: darwin-x64
            runner: macos-15-intel
          - label: linux-x64
            runner: ubuntu-24.04
          - label: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Build standalone binary
        run: node scripts/build-binaries.mjs ${{ matrix.label }}

      - name: Smoke test
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          binary="dist-binaries/foreman-${LABEL}"
          file "$binary" || true
          python3 scripts/smoke-binary.py "$binary"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foreman-${{ matrix.label }}
          path: dist-binaries/foreman-${{ matrix.label }}
          if-no-files-found: error

  checksums:
    name: Checksums and release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: foreman-*
          path: dist-binaries
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist-binaries
          chmod +x foreman-*
          sha256sum foreman-* | tee SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: dist-binaries/SHA256SUMS

      - name: Attach binaries and checksums to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist-binaries/foreman-* dist-binaries/SHA256SUMS --clobber
