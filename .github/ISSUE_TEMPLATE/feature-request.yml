name: Feature request
description: Propose a scoped user-facing improvement.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and by what current behavior?
      placeholder: "As a user ..., I need ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the user-visible behavior, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that make this complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could this change policy, approval, audit, identity, secrets, or network behavior?
    validations:
      required: true
